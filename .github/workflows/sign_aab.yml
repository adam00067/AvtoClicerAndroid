name: Sign AAB

on:
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Download AAB and keystore artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p input

          AAB_ID=$(gh api             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"             --jq '.artifacts[] | select(.name=="AvtoClicker-release" and .expired==false) | .id'             | head -n 1)

          KEY_ID=$(gh api             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"             --jq '.artifacts[] | select(.name=="avtokliker-upload-keystore" and .expired==false) | .id'             | head -n 1)

          if [ -z "$AAB_ID" ]; then
            echo "AAB artifact not found"
            exit 1
          fi

          if [ -z "$KEY_ID" ]; then
            echo "Keystore artifact not found"
            exit 1
          fi

          gh api             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AAB_ID}/zip" > input/aab.zip

          gh api             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${KEY_ID}/zip" > input/key.zip

          unzip -q input/aab.zip -d input/aab
          unzip -q input/key.zip -d input/key

          find input/aab -name "*.aab" -print
          find input/key -name "*.jks" -print

      - name: Sign AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          AAB=$(find input/aab -name "*.aab" | head -n 1)
          KEYSTORE=$(find input/key -name "*.jks" | head -n 1)

          if [ -z "$AAB" ] || [ -z "$KEYSTORE" ]; then
            echo "Required files not found"
            exit 1
          fi

          jarsigner             -keystore "$KEYSTORE"             -storepass "$KEYSTORE_PASSWORD"             -keypass "$KEYSTORE_PASSWORD"             -signedjar app-release-signed.aab             "$AAB"             avtokliker

          jarsigner -verify -verbose -certs app-release-signed.aab

      - name: Save signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: AvtoClicker-signed
          path: app-release-signed.aab
